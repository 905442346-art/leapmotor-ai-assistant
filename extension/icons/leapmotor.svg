<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 零跑汽车官方Logo - LP字母变形组合，形似φ符号 -->
  <!-- 外圈圆环 -->
  <circle cx="50" cy="50" r="38" stroke="#5A9A1B" stroke-width="6" fill="none"/>
  <!-- 中央竖线 -->
  <rect x="47" y="12" width="6" height="76" fill="#5A9A1B"/>
  <!-- 左侧弧线 (L的变形) -->
  <path d="M50 50 Q30 50 30 30" stroke="#5A9A1B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 右侧弧线 (P的变形) -->
  <path d="M50 50 Q70 50 70 30" stroke="#5A9A1B" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
